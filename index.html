 <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pınar Kırkpınar | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f127e2; --bg-light: #fff5f8; --text-light: #333;
            --bg-dark: #0f0f1a; --text-dark: #fff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-light); color: var(--text-light); transition: 0.5s; overflow-x: hidden; }
        body.dark-mode { background: var(--bg-dark); color: var(--text-dark); }

        /* Mouse'u Takip Eden Parıltı */
        #glow {
            position: fixed; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(241, 39, 226, 0.15) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
            z-index: 0; transition: 0.1s ease-out;
        }

        /* Üst Menü (Nav) - Ekran Resmi 22.41.09 Tarzı */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 8%; position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(241, 39, 226, 0.1);
        }
        body.dark-mode nav { background: rgba(15, 15, 26, 0.8); }

        .logo { font-weight: 800; color: var(--primary); font-size: 22px; cursor: pointer; }
        
        .nav-center { display: flex; gap: 30px; }
        .nav-center a { text-decoration: none; color: inherit; font-size: 14px; font-weight: 500; opacity: 0.7; transition: 0.3s; }
        .nav-center a:hover, .nav-center a.active { opacity: 1; color: var(--primary); border-bottom: 2px solid var(--primary); }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .social-icons i { font-size: 18px; cursor: pointer; opacity: 0.6; transition: 0.3s; }
        .social-icons i:hover { opacity: 1; color: var(--primary); }

        /* Tema ve Dil Seçici */
        .controls { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.05); padding: 5px 15px; border-radius: 50px; border: 1px solid rgba(241,39,226,0.2); }
        .dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
        .dot.black { background: #0f0f1a; }
        .dot.white { background: #ffffff; }
        .dot.pink { background: var(--primary); }

        /* Hero Kısmı */
        .hero { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; z-index: 1; }
        .hero h1 { font-size: 70px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
        .hero p { font-size: 20px; opacity: 0.7; max-width: 500px; line-height: 1.5; }

        .lang-en [lang="tr"], .lang-tr [lang="en"] { display: none; }
    </style>
</head>
<body class="lang-tr">

    <div id="glow"></div>

    <nav>
        <div class="logo">pınarkırkpınar</div>
        
        <div class="nav-center">
            <a href="#home" class="active">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#social">Social Media</a>
            <a href="#contact">Contact</a>
        </div>

        <div class="nav-right">
            <div class="social-icons">
                <a href="https://github.com/pinarkirkpinar" target="_blank" style="color:inherit;"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/pinarkirkpinar/" target="_blank" style="color:inherit; margin-left:15px;"><i class="fab fa-instagram"></i></a>
            </div>
            <div class="controls">
                <div class="dot black" onclick="setTheme('dark')"></div>
                <div class="dot white" onclick="setTheme('light')"></div>
                <div class="dot pink" onclick="toggleLang()"></div>
            </div>
        </div>
    </nav>

    <div class="hero" id="home">
        <h1 lang="tr">Selam, Ben Pınar</h1>
        <h1 lang="en">Hi, I'm Pinar</h1>
        <p lang="tr">Building modern web experiences.</p>
        <p lang="en">Building modern web experiences.</p>
        <div style="margin-top: 30px; display: flex; gap: 15px;">
            <button style="padding: 12px 25px; border-radius: 50px; border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer;">Let's Talk</button>
            <button style="padding: 12px 25px; border-radius: 50px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-weight: 600; cursor: pointer;">View Projects</button>
        </div>
    </div>

    <script>
        // Mouse'u Takip Eden Parıltı Efekti
        const glow = document.getElementById('glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // Tema Değiştirici
        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        // Dil Değiştirici
        function toggleLang() {
            document.body.classList.toggle('lang-tr');
            document.body.classList.toggle('lang-en');
        }
    </script>
</body>
</html>
